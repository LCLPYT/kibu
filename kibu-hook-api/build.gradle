plugins {
    id 'java'
}

archivesBaseName = "kibu-hook-api"

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'kibu-hook-api'
                description = 'Event based hook API with registration/unregistration.'
            }
        }
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

test {
    useJUnitPlatform()
}