plugins {
    id 'java'
}

base {
    archivesName = "kibu-hook-api"
}

publishing {
    publications {
        named("mavenJava", MavenPublication) {
            pom {
                name = 'kibu-hook-api'
                description = 'Event based hook API with registration/unregistration.'
            }
        }
    }
}

test {
    useJUnitPlatform()
}