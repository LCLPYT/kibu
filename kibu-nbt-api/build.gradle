plugins {
    id 'java'
}

base {
    archivesName = "kibu-nbt-api"
}

publishing {
    publications {
        named("mavenJava", MavenPublication) {
            pom {
                name = 'kibu-nbt-api'
                description = 'A modified JNBT implementation for modern Java versions.'
            }
        }
    }
}

test {
    useJUnitPlatform()
}