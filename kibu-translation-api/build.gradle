plugins {
    id 'java'
}

base {
    archivesName = "kibu-translation-api"
}

moduleDependencies(project, [
        'kibu-access-lib',
        'kibu-hook-api'
])

publishing {
    publications {
        named("mavenJava", MavenPublication) {
            pom {
                name = 'kibu-translation-api'
                description = 'An API for server-sided translations.'
            }
        }
    }
}

dependencies {
    implementation(libs.translations4j)
    include(libs.translations4j)
}

test {
    useJUnitPlatform()
}